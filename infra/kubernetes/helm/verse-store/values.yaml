nameOverride: ""
fullnameOverride: "verse"
existingSecret: ""

image:
  repository: ghcr.io/munteanooo/verse-store
  tag: "sha-replace-with-published-commit"
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

app:
  replicaCount: 1
  port: 8080
  publicBaseUrl: https://verse.local
  terminationGracePeriodSeconds: 30
  resources:
    requests: {cpu: 250m, memory: 384Mi}
    limits: {cpu: "1", memory: 768Mi}
  probes:
    startup: {failureThreshold: 30, periodSeconds: 5}
    readiness: {initialDelaySeconds: 5, periodSeconds: 10}
    liveness: {initialDelaySeconds: 20, periodSeconds: 15}

postgres:
  image: postgres:17-alpine
  database: verse_store
  username: verse
  storageClass: ""
  storageSize: 2Gi
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}

keycloakPostgres:
  image: postgres:17-alpine
  database: keycloak
  username: keycloak
  storageClass: ""
  storageSize: 2Gi
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}

keycloak:
  image: quay.io/keycloak/keycloak:26.7.1
  bootstrapAdminUsername: admin
  publicBaseUrl: https://auth.verse.local
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: "1", memory: 1Gi}

minio:
  image: minio/minio:RELEASE.2025-09-07T16-13-09Z
  bucket: verse-product-images
  storageClass: ""
  storageSize: 5Gi
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 500m, memory: 512Mi}

mailpit:
  enabled: false
  image: axllent/mailpit:v1.30
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {cpu: 200m, memory: 256Mi}

ingress:
  enabled: false
  className: nginx
  tlsSecretName: verse-local-tls
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "6m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "15"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
  app:
    host: verse.local
  keycloak:
    host: auth.verse.local
  mailpit:
    enabled: false
    host: mail.verse.local

networkPolicy:
  enabled: false

podDisruptionBudget:
  enabled: false
  minAvailable: 1
