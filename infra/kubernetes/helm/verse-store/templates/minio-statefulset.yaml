apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "verse-store.fullname" . }}-minio
  labels:
    {{- include "verse-store.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "verse-store.fullname" . }}-minio
  replicas: 1
  updateStrategy: {type: RollingUpdate}
  selector:
    matchLabels:
      {{- include "verse-store.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: minio
  template:
    metadata:
      labels:
        {{- include "verse-store.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: minio
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: minio
          image: {{ .Values.minio.image | quote }}
          args: ["server", "/data", "--console-address", ":9001"]
          ports:
            - {name: api, containerPort: 9000}
            - {name: console, containerPort: 9001}
          env:
            - name: MINIO_ROOT_USER
              valueFrom: {secretKeyRef: {name: {{ include "verse-store.secretName" . }}, key: minio-root-user}}
            - name: MINIO_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ include "verse-store.secretName" . }}, key: minio-root-password}}
          startupProbe:
            httpGet: {path: /minio/health/live, port: api}
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet: {path: /minio/health/ready, port: api}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /minio/health/live, port: api}
            initialDelaySeconds: 20
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          resources: {{ toYaml .Values.minio.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /data}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.minio.storageClass }}
        storageClassName: {{ .Values.minio.storageClass | quote }}
        {{- end }}
        resources: {requests: {storage: {{ .Values.minio.storageSize }}}}
