{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "verse-store.fullname" . }}-default-deny
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "verse-store.fullname" . }}-dns
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "verse-store.fullname" . }}-app
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/component: app}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {}
      ports: [{protocol: TCP, port: 8080}]
    {{- if .Values.monitoring.enabled }}
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: monitoring}
      ports: [{protocol: TCP, port: {{ .Values.app.managementPort }}}]
    {{- end }}
  egress:
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/component: postgres}}}]
      ports: [{protocol: TCP, port: 5432}]
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/component: keycloak}}}]
      ports: [{protocol: TCP, port: 8080}]
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/component: minio}}}]
      ports: [{protocol: TCP, port: 9000}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "verse-store.fullname" . }}-keycloak
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/component: keycloak}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - {protocol: TCP, port: 8080}
        - {protocol: TCP, port: 9000}
  egress:
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/component: keycloak-postgres}}}]
      ports: [{protocol: TCP, port: 5432}]
    {{- if .Values.mailpit.enabled }}
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/component: mailpit}}}]
      ports: [{protocol: TCP, port: 1025}]
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "verse-store.fullname" . }}-data-ingress
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [postgres, keycloak-postgres, minio{{ if .Values.mailpit.enabled }}, mailpit{{ end }}]
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: [app, keycloak]
{{- end }}
