{{- if .Values.mailpit.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "verse-store.fullname" . }}-mailpit
  labels:
    {{- include "verse-store.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "verse-store.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: mailpit
  ports:
    - {name: smtp, port: 1025, targetPort: smtp}
    - {name: http, port: 8025, targetPort: http}
{{- end }}

