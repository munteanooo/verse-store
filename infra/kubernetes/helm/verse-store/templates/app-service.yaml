apiVersion: v1
kind: Service
metadata:
  name: {{ include "verse-store.fullname" . }}
  labels:
    {{- include "verse-store.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "verse-store.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: app
  ports:
    - {name: http, port: 8080, targetPort: http}

