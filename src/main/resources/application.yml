spring:
  application:
    name: verse-store
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/verse_store}
    username: ${DATABASE_USERNAME:verse_store}
    password: ${DATABASE_PASSWORD:verse_store}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

server:
  shutdown: graceful

