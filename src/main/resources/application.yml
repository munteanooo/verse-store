spring:
  application:
    name: verse-store
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/verse_store}
    username: ${DATABASE_USERNAME:verse_store}
    password: ${DATABASE_PASSWORD:verse_store}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  security:
    oauth2:
      client:
        registration:
          verse-store:
            provider: keycloak
            client-id: verse-store
            client-secret: ${KEYCLOAK_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid,profile,email
        provider:
          keycloak:
            authorization-uri: ${KEYCLOAK_AUTHORIZATION_URI:http://localhost:8180/realms/verse/protocol/openid-connect/auth}
            token-uri: ${KEYCLOAK_TOKEN_URI:http://localhost:8180/realms/verse/protocol/openid-connect/token}
            user-info-uri: ${KEYCLOAK_USER_INFO_URI:http://localhost:8180/realms/verse/protocol/openid-connect/userinfo}
            jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/verse/protocol/openid-connect/certs}
            user-name-attribute: preferred_username
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/verse}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/verse/protocol/openid-connect/certs}

verse:
  security:
    keycloak-public-base-url: ${KEYCLOAK_PUBLIC_BASE_URL:http://localhost:8180}
    realm: verse
    client-id: verse-store
    post-logout-redirect-uri: ${KEYCLOAK_POST_LOGOUT_REDIRECT_URI:http://localhost:8080/}

app:
  storefront:
    introduction: "A considered wardrobe of essential forms, quiet colors and pieces designed for everyday movement."
  security:
    keycloak-public-url: ${KEYCLOAK_PUBLIC_BASE_URL:http://localhost:8180}
    realm: verse
    client-id: verse-store
    post-logout-redirect-uri: ${KEYCLOAK_POST_LOGOUT_REDIRECT_URI:http://localhost:8080/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

server:
  shutdown: graceful
