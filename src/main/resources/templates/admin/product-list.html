<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" href="data:,">
  <title>Product Control Plane — Verse</title><link rel="stylesheet" th:href="@{/css/verse.css}">
  <script defer th:src="@{/js/admin-products.js}"></script></head>
<body><div class="page-shell admin-shell">
  <header th:replace="~{fragments/layout :: header}"></header>
  <main id="main-content" data-admin-list>
    <div class="admin-heading"><div><p class="eyebrow">Local development · unsecured</p><h1>Product Control Plane</h1></div>
      <a class="button button--dark" th:href="@{/admin/products/new}">New product</a></div>
    <div class="feedback" role="status" aria-live="polite" th:classappend="${notice == null} ? ' is-hidden'" th:text="${notice}">Updated.</div>
    <form class="filter-bar" method="get" th:action="@{/admin/products}" data-auto-submit>
      <label>Status<select name="status"><option value="">All statuses</option>
        <option th:each="item : ${statuses}" th:value="${item}" th:text="${item}" th:selected="${item == selectedStatus}">DRAFT</option></select></label>
      <label>Category<select name="category"><option value="">All categories</option>
        <option th:each="item : ${categories}" th:value="${item}" th:text="${item}" th:selected="${item == selectedCategory}">TOPS</option></select></label>
      <a class="text-link reset-link" th:href="@{/admin/products}">Reset</a><button class="button button--dark filter-submit">Apply</button>
    </form>
    <div class="table-wrap">
      <table class="product-table"><thead><tr><th>Product</th><th>Category</th><th>Collection</th><th>Status</th><th>Final price</th><th>Stock</th><th><span class="sr-only">Actions</span></th></tr></thead>
      <tbody><tr th:each="product : ${products.content}" th:attr="data-product-id=${product.id}">
        <td data-label="Product"><strong th:text="${product.name}">Name</strong><span th:text="${product.brand}">Brand</span></td>
        <td data-label="Category" th:text="${product.category}">TOPS</td><td data-label="Collection" th:text="${product.collectionName}">Collection</td>
        <td data-label="Status"><span class="status" th:classappend="| status--${#strings.toLowerCase(product.status)}|" th:text="${product.status}">DRAFT</span></td>
        <td data-label="Final price" th:text="|€${#numbers.formatDecimal(product.finalPrice, 1, 2)}|">€0.00</td><td data-label="Stock" th:text="${product.totalStock}">0</td>
        <td data-label="Actions"><div class="row-actions"><a class="text-link" th:href="@{/admin/products/{id}/edit(id=${product.id})}">Edit</a>
          <button class="link-button" th:if="${product.status.name() == 'DRAFT'}" data-action="publish">Publish</button>
          <button class="link-button" th:if="${product.status.name() == 'ACTIVE'}" data-action="archive">Archive</button>
          <button class="link-button link-button--danger" th:if="${product.status.name() == 'DRAFT'}" data-action="delete">Delete</button></div></td>
      </tr></tbody></table>
      <div class="empty-state compact" th:if="${!products.hasContent()}"><h2>No products found.</h2><p>Change the filters or create a new draft.</p></div>
    </div>
    <nav class="pagination" aria-label="Admin product pages" th:if="${products.totalPages > 1}">
      <a th:if="${products.hasPrevious()}" th:href="@{/admin/products(page=${products.number - 1},size=${products.size},status=${selectedStatus},category=${selectedCategory})}">← Previous</a>
      <span th:text="|Page ${products.number + 1} of ${products.totalPages}|">Page</span>
      <a th:if="${products.hasNext()}" th:href="@{/admin/products(page=${products.number + 1},size=${products.size},status=${selectedStatus},category=${selectedCategory})}">Next →</a>
    </nav>
  </main><footer th:replace="~{fragments/layout :: footer}"></footer>
</div></body></html>
