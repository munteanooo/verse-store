name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Maven verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 26
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "26"
          cache: maven

      - name: Verify with Maven
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: surefire-reports-${{ github.sha }}
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

      - name: Add test summary
        if: success()
        run: |
          {
            echo "### Maven verification"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Java: \`$(java -version 2>&1 | head -n 1)\`"
            echo "- Result: all unit and Testcontainers integration tests passed"
          } >> "$GITHUB_STEP_SUMMARY"

  compose-validation:
    name: Validate Compose
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Compose configuration
        env:
          POSTGRES_DB: verse_store_ci
          POSTGRES_USER: verse_ci
          POSTGRES_PASSWORD: ci-validation-only
          KEYCLOAK_DB: keycloak_ci
          KEYCLOAK_DB_USER: keycloak_ci
          KEYCLOAK_DB_PASSWORD: ci-validation-only
          KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME: admin
          KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD: ci-validation-only
          KEYCLOAK_CLIENT_SECRET: ci-validation-only-client-secret
          MINIO_ROOT_USER: minio-ci
          MINIO_ROOT_PASSWORD: ci-validation-only-minio-password
          APP_PORT: "8080"
        run: docker compose config --quiet

      - name: Confirm required credentials remain mandatory
        env:
          POSTGRES_PASSWORD: ci-validation-only
          KEYCLOAK_DB: keycloak_ci
          KEYCLOAK_DB_USER: keycloak_ci
          KEYCLOAK_DB_PASSWORD: ci-validation-only
          KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME: admin
          KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD: ci-validation-only
          KEYCLOAK_CLIENT_SECRET: ci-validation-only-client-secret
          MINIO_ROOT_USER: minio-ci
          MINIO_ROOT_PASSWORD: ci-validation-only-minio-password
        run: |
          assert_required() {
            variable="$1"
            expected_message="$2"
            if output="$(env -u "$variable" docker compose --env-file /dev/null config --quiet 2>&1)"; then
              echo "Compose unexpectedly accepted a missing ${variable}" >&2
              exit 1
            fi
            if ! grep -Fq "$expected_message" <<< "$output"; then
              echo "Compose failed for an unexpected reason while testing ${variable}" >&2
              exit 1
            fi
          }

          assert_required POSTGRES_PASSWORD "POSTGRES_PASSWORD must be set in .env"
          assert_required KEYCLOAK_CLIENT_SECRET "KEYCLOAK_CLIENT_SECRET must be set in .env"
          assert_required MINIO_ROOT_USER "MINIO_ROOT_USER must be set in .env"
          assert_required MINIO_ROOT_PASSWORD "MINIO_ROOT_PASSWORD must be set in .env"
          echo "Required credential validation is active." >> "$GITHUB_STEP_SUMMARY"

  filesystem-scan:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan dependencies, configuration, and secrets
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          format: table
          exit-code: "1"
          skip-dirs: .git,target

  kubernetes-validation:
    name: Validate Helm and Kubernetes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reject committed Kubernetes Secrets and private keys
        shell: bash
        run: |
          if git ls-files | grep -Ei '(^|/)(tls\.key|.*\.key|.*\.p12|.*\.pfx)$'; then
            echo "Private key material must not be committed." >&2
            exit 1
          fi
          if grep -RIl --include='*.yaml' --include='*.yml' '^kind:[[:space:]]*Secret[[:space:]]*$' infra/kubernetes; then
            echo "Rendered Kubernetes Secret manifests must not be committed." >&2
            exit 1
          fi

      - name: Helm lint and render
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace alpine/helm:3.19.0 \
            lint --strict infra/kubernetes/helm/verse-store \
            -f infra/kubernetes/helm/verse-store/values-local.yaml.example \
            --set-string existingSecret=ci-secret --set-string image.tag=sha-ci
          docker run --rm -v "$PWD:/workspace" -w /workspace alpine/helm:3.19.0 \
            template verse-store infra/kubernetes/helm/verse-store --namespace verse-dev \
            -f infra/kubernetes/helm/verse-store/values-local.yaml.example \
            --set-string existingSecret=ci-secret --set-string image.tag=sha-ci > rendered-kubernetes.yaml

      - name: Validate rendered manifests with kubeconform
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace \
            ghcr.io/yannh/kubeconform:v0.7.0 \
            -strict -summary -kubernetes-version 1.30.0 rendered-kubernetes.yaml

  container-build:
    name: Build and scan image
    needs: [test, compose-validation, filesystem-scan, kubernetes-validation]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build local CI image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          pull: true
          load: true
          push: false
          tags: verse-store:ci-${{ github.sha }}
          cache-from: type=gha,scope=ci
          cache-to: type=gha,mode=max,scope=ci

      - name: Confirm non-root image user
        run: |
          user="$(docker image inspect --format '{{.Config.User}}' "verse-store:ci-${GITHUB_SHA}")"
          test "$user" = "verse:verse"

      - name: Scan image for blocking vulnerabilities
        id: trivy
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: verse-store:ci-${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"

      - name: Generate image vulnerability report
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: verse-store:ci-${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: json
          output: trivy-image.json
          exit-code: "0"

      - name: Generate SPDX SBOM
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: verse-store:ci-${{ github.sha }}
          scanners: vuln
          format: spdx-json
          output: verse-store-sbom.spdx.json
          exit-code: "0"

      - name: Upload security artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: container-security-${{ github.sha }}
          path: |
            trivy-image.json
            verse-store-sbom.spdx.json
          if-no-files-found: error
          retention-days: 14

      - name: Add container summary
        if: success()
        run: |
          {
            echo "### Container verification"
            echo "- Image: \`verse-store:ci-${GITHUB_SHA}\`"
            echo "- Runtime user: \`verse:verse\`"
            echo "- Trivy: blocking scan passed"
            echo "- SBOM: SPDX JSON artifact uploaded"
          } >> "$GITHUB_STEP_SUMMARY"
