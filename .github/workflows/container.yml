name: Container Publish

on:
  push:
    branches: [dev, main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/munteanooo/verse-store

jobs:
  test:
    name: Maven verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 26
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "26"
          cache: maven

      - name: Verify with Maven
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: publish-surefire-reports-${{ github.sha }}
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Scan and publish GHCR image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Derive validated image metadata
        id: meta
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          created="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          version="sha-${GITHUB_SHA}"
          tags="${IMAGE_NAME}:sha-${GITHUB_SHA}"

          if [[ "$REF_TYPE" == "branch" && "$REF_NAME" == "dev" ]]; then
            version="dev"
            tags+=$'\n'"${IMAGE_NAME}:dev"
          elif [[ "$REF_TYPE" == "branch" && "$REF_NAME" == "main" ]]; then
            version="main"
            tags+=$'\n'"${IMAGE_NAME}:main"
            tags+=$'\n'"${IMAGE_NAME}:latest"
          elif [[ "$REF_TYPE" == "tag" ]]; then
            semantic_version="${REF_NAME#v}"
            if [[ ! "$semantic_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
              echo "Tag must be a semantic version beginning with v" >&2
              exit 1
            fi
            version="$semantic_version"
            tags+=$'\n'"${IMAGE_NAME}:${semantic_version}"
          fi

          {
            echo "created=$created"
            echo "version=$version"
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build local release candidate
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          push: false
          tags: verse-store:release-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.title=Verse Store
            org.opencontainers.image.description=Minimalist product catalog and local administration interface
          cache-from: type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release

      - name: Confirm non-root image user
        run: |
          user="$(docker image inspect --format '{{.Config.User}}' "verse-store:release-${GITHUB_SHA}")"
          test "$user" = "verse:verse"

      - name: Scan release candidate
        id: trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: verse-store:release-${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"

      - name: Generate SPDX SBOM before publication
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: verse-store:release-${{ github.sha }}
          scanners: vuln
          format: spdx-json
          output: verse-store-sbom.spdx.json
          exit-code: "0"

      - name: Upload SBOM
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: verse-store-sbom-${{ github.sha }}
          path: verse-store-sbom.spdx.json
          if-no-files-found: error
          retention-days: 14

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push verified image tags
        id: push
        env:
          PUBLISH_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          first_tag=""
          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            [[ -n "$first_tag" ]] || first_tag="$tag"
            docker tag "verse-store:release-${GITHUB_SHA}" "$tag"
            docker push "$tag"
          done <<< "$PUBLISH_TAGS"

          digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "$first_tag" | cut -d@ -f2)"
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Add publication summary
        if: always()
        env:
          PUBLISH_TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
          TRIVY_RESULT: ${{ steps.trivy.outcome }}
        run: |
          {
            echo "### GHCR publication"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Java: \`26 (Temurin)\`"
            echo "- Image: \`${IMAGE_NAME}\`"
            echo "- Tags:"
            while IFS= read -r tag; do [[ -n "$tag" ]] && echo "  - \`$tag\`"; done <<< "$PUBLISH_TAGS"
            echo "- Trivy: \`${TRIVY_RESULT}\`"
            echo "- Digest: \`${IMAGE_DIGEST:-not published}\`"
            echo "- Package: https://github.com/${GITHUB_REPOSITORY}/pkgs/container/verse-store"
          } >> "$GITHUB_STEP_SUMMARY"
